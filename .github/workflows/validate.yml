name: Check puzzle packs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the schema checker
        run: npm ci --no-audit --no-fund
      - name: Check every pack in packs/
        run: node scripts/validate-packs.js
